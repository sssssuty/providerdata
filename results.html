<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provider Results</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    body { 
      background: #111111; 
      margin: 0; 
      padding: 0; 
      color: #ffffff; 
      font-family: Helvetica, Arial, sans-serif;
    }
    
    /* Chart and table styling for sticky slides */
    .chart-container { 
      background: transparent; 
      border: none; 
      border-radius: 8px; 
      padding: 20px; 
    }
    
    .data-table { 
      background: transparent; 
      border: none; 
      border-radius: 8px; 
      padding: 20px;
      padding-top: 60px;
    }
    
    .table-wrapper {
      max-height: calc(80vh - 60px);
      overflow: auto;
    }
    
    .data-table table { 
      width: max-content; 
      min-width: 100%; 
      table-layout: auto; 
      border-radius: 4px; 
      overflow: hidden; 
      background: transparent;
    }
    
    .data-table th, .data-table td { 
      border-right: 1px solid #e0e0e0; 
      font-size: 16px; 
      white-space: nowrap; 
      min-width: 120px; 
      max-width: none; 
      color: #000000; 
      padding: 8px 12px;
      background: transparent;
    }
    
    .data-table th:last-child, .data-table td:last-child { 
      border-right: none; 
    }
    
    .data-table th { 
      position: sticky; 
      top: 0; 
      z-index: 20; 
      background: rgba(255, 255, 255, 0.2) !important; 
      color: #000000; 
      font-weight: 600;
    }
    
    .data-table th:first-child, .data-table td:first-child { 
      position: sticky; 
      left: 0; 
      background: rgba(255, 255, 255, 0.2); 
      z-index: 25; 
      min-width: 150px; 
      max-width: 200px; 
    }
    
    .data-table th:first-child { 
      background: rgba(255, 255, 255, 0.2) !important; 
    }
    
    .data-table td:first-child { 
      background: rgba(255, 255, 255, 0.2) !important; 
    }
    
    /* Specific styling for Procedure Code Description column */
    .summary-table th:nth-child(2), 
    .summary-table td:nth-child(2) {
      width: 300px !important;
      max-width: 300px !important;
      min-width: 300px !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      white-space: nowrap !important;
    }
    
    .data-table h3 { 
      margin-bottom: 20px; 
      text-align: left; 
      color: #000000;
      font-size: 1.5em;
      font-weight: 600;
    }
    
    /* Google Charts styling */
    .google-chart {
      width: 100% !important;
      max-height: 840px;
    }
    
    .google-chart svg g text:nth-child(n+3) {
      font-size: 20px !important;
    }
    
    .google-chart svg g[aria-label*="slice"] {
      transition: opacity 0.3s ease;
    }
    
    .font-helvetica {
      font-family: Helvetica, Arial, sans-serif;
    }
    
    /* Fade-in animation styles */
    .slide-component {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 2s ease-out, transform 2s ease-out;
    }
    
    .slide-component.fade-in {
      opacity: 1;
      transform: translateY(0);
    }
    
    .slide-component:nth-child(1) { transition-delay: 0.1s; }
    .slide-component:nth-child(2) { transition-delay: 0.2s; }
    .slide-component:nth-child(3) { transition-delay: 0.3s; }
    .slide-component:nth-child(4) { transition-delay: 0.4s; }
    .slide-component:nth-child(5) { transition-delay: 0.5s; }
    .slide-component:nth-child(6) { transition-delay: 0.6s; }
    
    /* Mobile responsiveness */
    @media (max-width: 768px) {
      .google-chart {
        height: 600px !important;
        min-height: 480px;
        max-height: 600px;
      }
      
      .data-table {
        max-height: 70vh;
      }
      
      .data-table th, .data-table td {
        font-size: 12px;
        padding: 6px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="relative">
    <!-- Slide 1: Greeting -->
    <div class="sticky top-0 h-screen flex flex-col items-center justify-center text-white" style="background: linear-gradient(to bottom, #0C0554, #08033A);">
      <h2 id="typewriter-text" class="slide-component text-4xl font-bold font-helvetica"></h2>
      <p id="scroll-instruction" class="slide-component mt-4 text-lg opacity-0 transition-opacity duration-[2000ms]">Scroll Down for Analysis</p>
    </div>
    
    <!-- Slide 2: Volume Chart -->
    <div class="sticky top-0 h-screen flex flex-col items-center justify-center text-white" style="background: linear-gradient(to bottom, #070A1F, #050714);">
      <div class="w-full max-w-6xl px-8">
        <div class="chart-container slide-component rounded-lg p-6 mb-6">
          <div class="chart-header flex justify-between items-center mb-4">
            <div class="chart-title text-2xl font-bold">Procedure Code and Volume</div>
            <button class="download-btn bg-white text-black px-4 py-2 rounded hover:bg-gray-200 transition-colors" onclick="downloadChart('chart1')" title="Download Chart">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7,10 12,15 17,10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
            </button>
          </div>
          <div id="chart1" class="google-chart"></div>
        </div>
      </div>
    </div>
    
    <!-- Slide 3: Payment Chart -->
    <div class="sticky top-0 h-screen flex flex-col items-center justify-center text-white" style="background: linear-gradient(to bottom, #1B164E, #15113A);">
      <div class="w-full max-w-6xl px-8">
        <div class="chart-container slide-component rounded-lg p-6 mb-6">
          <div class="chart-header flex justify-between items-center mb-4">
            <div class="chart-title text-2xl font-bold">Procedure Code and Payment</div>
            <button class="download-btn bg-white text-black px-4 py-2 rounded hover:bg-gray-200 transition-colors" onclick="downloadChart('chart2')" title="Download Chart">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7,10 12,15 17,10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
            </button>
          </div>
          <div id="chart2" class="google-chart"></div>
        </div>
      </div>
    </div>
    
    <!-- Slide 4: Summary Table -->
    <div class="sticky top-0 h-screen flex flex-col items-center justify-center text-black" style="background: linear-gradient(to bottom, #C4D7FF, #A8C7FF);">
      <div class="w-full max-w-7xl px-8">
        <div class="data-table slide-component rounded-lg p-6" id="summaryTable">
          <!-- Table content will be populated by JavaScript -->
        </div>
      </div>
    </div>
    
    <!-- Slide 5: Raw Data Table -->
    <div class="sticky top-0 h-screen flex flex-col items-center justify-center text-black" style="background: linear-gradient(to bottom, #9BBCFF, #7BA3FF);">
      <div class="w-full max-w-7xl px-8">
        <div class="data-table slide-component rounded-lg p-6" id="rawTable">
          <!-- Table content will be populated by JavaScript -->
        </div>
      </div>
    </div>
    
    <!-- Slide 6: Comparison Search -->
    <div class="sticky top-0 h-screen flex flex-col items-center justify-center text-white" style="background: linear-gradient(to bottom, #0C0554, #08033A);">
      <div class="w-full max-w-3xl px-8">
        <div class="slide-component">
          <h2 class="text-4xl font-bold text-center mb-8 font-helvetica">Want to compare with another provider?</h2>
          <div class="comparison-form-container" style="background: rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 40px; backdrop-filter: blur(10px);">
            <form id="comparisonForm">
              <div class="form-group" style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #ffffff;">NPI Number</label>
                <input type="text" id="compareNpi" name="npi" placeholder="e.g., 1234567890" style="width: 100%; padding: 12px 15px; border: 1px solid #555555; border-radius: 4px; font-size: 16px; background: #ffffff; color: #000000;">
              </div>
              <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                <div class="form-group" style="flex: 1;">
                  <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #ffffff;">First Name</label>
                  <input type="text" id="compareFirstName" name="firstName" style="width: 100%; padding: 12px 15px; border: 1px solid #555555; border-radius: 4px; font-size: 16px; background: #ffffff; color: #000000;">
                </div>
                <div class="form-group" style="flex: 1;">
                  <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #ffffff;">Last Name</label>
                  <input type="text" id="compareLastName" name="lastName" style="width: 100%; padding: 12px 15px; border: 1px solid #555555; border-radius: 4px; font-size: 16px; background: #ffffff; color: #000000;">
                </div>
                <div class="form-group" style="flex: 1;">
                  <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #ffffff;">State</label>
                  <input type="text" id="compareState" name="state" maxlength="2" placeholder="e.g., CA, NY, TX" style="width: 100%; padding: 12px 15px; border: 1px solid #555555; border-radius: 4px; font-size: 16px; background: #ffffff; color: #000000;">
                </div>
              </div>
              <button type="submit" class="btn" style="background: #ffffff; color: #000000; border: 1px solid #ffffff; padding: 15px 30px; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; transition: all 0.2s ease;" onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='#ffffff'">
                Confirm
              </button>
            </form>
            <div id="comparisonStatus" style="margin-top: 20px; padding: 15px; border-radius: 4px; display: none;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Hidden Plotly charts for downloads -->
  <div id="plotly-chart1" style="display: none;"></div>
  <div id="plotly-chart2" style="display: none;"></div>

  <script src="cpt_data.js"></script>
  <script>
    // Make API functions available for comparison form
    // These are needed by results.js for the comparison search
  </script>
  <script src="scripts.js"></script>
  <script src="results.js"></script>
</body>
</html>
