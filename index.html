<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Lookup & Medicare Data Tool</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="form-section">
            <div class="form-container">
                <h2 style="margin-bottom: 40px;">🔍 Enter Provider Info</h2>
                <form id="providerForm">
                    <div class="form-group">
                        <label for="npi">NPI Number</label>
                        <input type="text" id="npi" name="npi" placeholder="e.g., 1234567890">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" name="firstName">
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" name="lastName">
                        </div>
                        <div class="form-group">
                            <label for="state">State</label>
                            <input type="text" id="state" name="state" maxlength="2" placeholder="e.g., CA, NY, TX">
                        </div>
                    </div>
                    <button type="submit" class="btn" id="searchBtn">
                        🔍 Search Provider
                    </button>
                </form>
            </div>
        </div>

        <div class="results-section" id="resultsSection">
            <div id="statusMessages"></div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div id="searchResults"></div>
        </div>

    </div>

    <script src="cpt_data.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
